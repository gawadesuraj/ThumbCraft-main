version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: studio-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - studio-network

  # Backend Node Server Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studio-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/ai-thumbnail-studio
      - JWT_SECRET=change_this_to_something_secure_in_production
      - JWT_REFRESH_SECRET=change_this_to_another_secure_key_for_refresh
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
    networks:
      - studio-network

volumes:
  mongo-data:

networks:
  studio-network:
    driver: bridge
